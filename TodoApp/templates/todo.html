{% include 'layout.html' %}

<div class="container">
    <div class="card text-center">
        <div class="card-header">
            Your Todo's
        </div>
        <div class="card-body">
            <h5 class="card-title">
                List of your todo's
            </h5>
            <p class="card-text">
                information to complete
            </p>

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Info</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {%for todo in todos%}
                    {% if todo.complete == False %}
                    <tr class="pointer">
                        <td>{{loop.index}}</td>
                        <!-- Allineiamo il testo a sinistra per gestire meglio i dettagli dell'IA -->
                        <td class="text-start">
                            <strong>{{todo.title}}</strong>
                            <div>
                            <span class="badge">{{ todo.category }}</span>
                            </div>
                            <!-- BLOCCO IA INTEGRATO -->
                            <div class="mt-2 p-2 bg-light rounded border" style="max-width: 400px;">
                                <button class="btn btn-sm btn-outline-secondary btn-ai" 
                                        data-title="{{ todo.title }}" 
                                        data-todo-id="{{ todo.id }}">
                                     Suggerisci sotto-compiti
                                </button>
                                
                                <!-- Contenitore dinamico per i risultati dell'IA -->
                                <div id="ai-results-{{ todo.id }}" class="mt-2 d-none">
                                    <ul id="subtasks-list-{{ todo.id }}" class="list-group list-group-flush text-start small">
                                        <!-- Popolato da JavaScript -->
                                    </ul>
                                </div>
                            </div>
                            <!-- ------------------ -->
                        </td>
                        <td>
                            <button onclick="window.location.href ='edit-todo-page/{{todo.id}}'"
                                    type="button" class="btn btn-info">
                               Edit
                            </button>
                        </td>
                    </tr>
                    {% else %}
                    <tr class="pointer alert alert-success">
                        <td>{{loop.index}}</td>
                        <td class="strike-through-td text-start">{{todo.title}}</td>
                        <td>
                            <button onclick="window.location.href ='edit-todo-page/{{todo.id}}'"
                                    type="button" class="btn btn-info">
                               Edit
                            </button>
                        </td>
                    </tr>
                    {% endif %}
                    {% endfor%}
                </tbody>
            </table>
            <a href="add-todo-page" class="btn btn-primary">Add new todo</a>
        </div>
    </div>
</div>

<script src="{{ url_for('static', path='js/ai-assistant.js') }}"></script>
